<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>石家庄二中实验学校 · 26届 A10班 · 毕业蹭饭地图</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#04070f;
  --bg2:#070c1a;
  --cyan:#22d3ee;
  --cyan-soft:#7be8ff;
  --teal:#14f1d0;
  --violet:#8b5cf6;
  --blue:#3b82f6;
  --ink:#e8f2ff;
  --muted:#8aa2c4;
  --glass:rgba(13,22,42,.62);
  --line:rgba(34,211,238,.18);
  --line-strong:rgba(34,211,238,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(120% 90% at 50% -10%, #0b1630 0%, var(--bg2) 42%, var(--bg) 100%);
  color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow-x:hidden;
}
::selection{background:rgba(34,211,238,.3)}

/* ---------- background layers ---------- */
#bg,#aurora,#gridline{
  position:fixed; inset:0; pointer-events:none;
  transition:filter .6s ease;
}
#bg{z-index:0}
#aurora{z-index:0;
  background:
    radial-gradient(38% 30% at 78% 18%, rgba(139,92,246,.16), transparent 70%),
    radial-gradient(42% 34% at 15% 30%, rgba(34,211,238,.14), transparent 70%),
    radial-gradient(50% 40% at 55% 85%, rgba(59,130,246,.12), transparent 70%);
  filter:blur(2px);
  animation:aurora 16s ease-in-out infinite alternate;
}
@keyframes aurora{
  0%{opacity:.7; transform:translate3d(0,0,0) scale(1)}
  100%{opacity:1; transform:translate3d(2%, -1%,0) scale(1.06)}
}
#gridline{z-index:1; opacity:.5;
  background-image:
    linear-gradient(rgba(34,211,238,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,.05) 1px, transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(90% 80% at 50% 45%, #000 0%, transparent 78%);
  -webkit-mask-image:radial-gradient(90% 80% at 50% 45%, #000 0%, transparent 78%);
}
body.focused #bg, body.focused #aurora, body.focused #gridline{filter:blur(14px) brightness(.75)}

/* ---------- header ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 26px;
  transition:filter .6s ease, opacity .6s ease;
}
body.focused header{filter:blur(10px); opacity:.55}
.brand{display:flex; align-items:center; gap:14px}
.logo{
  width:42px;height:42px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(135deg, rgba(34,211,238,.25), rgba(139,92,246,.25));
  border:1px solid var(--line-strong);
  box-shadow:0 0 22px rgba(34,211,238,.35), inset 0 0 14px rgba(34,211,238,.18);
  font-size:20px;
}
.title h1{
  font-family:"Orbitron","Noto Sans SC",sans-serif;
  font-size:20px; letter-spacing:2px; font-weight:700;
  background:linear-gradient(90deg,#eaf6ff,#7be8ff 55%,#c4b5fd);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.title p{font-size:12px; color:var(--muted); letter-spacing:3px; margin-top:2px}
.topnav{display:flex; gap:12px; align-items:center}
.navbtn{
  cursor:pointer; border:1px solid var(--line); color:var(--ink);
  background:rgba(13,22,42,.5); backdrop-filter:blur(8px);
  padding:9px 16px; border-radius:999px; font-size:13px; letter-spacing:1px;
  transition:.25s;
}
.navbtn:hover{border-color:var(--cyan); color:var(--cyan-soft); box-shadow:0 0 18px rgba(34,211,238,.35)}
.navbtn.primary{
  background:linear-gradient(90deg, rgba(34,211,238,.2), rgba(139,92,246,.2));
  border-color:var(--line-strong); color:var(--cyan-soft);
}

/* ---------- stage ---------- */
#stage{position:fixed; inset:0; z-index:10}
#glwrap{position:absolute; inset:0}
#scene{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
#scene:active{cursor:grabbing}
#css2d{position:absolute; inset:0; overflow:hidden; pointer-events:none}

#hint{
  position:absolute; left:50%; bottom:26px; transform:translateX(-50%); z-index:14;
  font-size:12.5px; letter-spacing:1.5px; color:var(--muted);
  padding:9px 18px; border:1px solid var(--line); border-radius:999px;
  background:rgba(8,14,28,.5); backdrop-filter:blur(6px);
  transition:opacity .5s;
}
#hint kbd{color:var(--cyan-soft)}

/* ---------- province panel ---------- */
#panel{
  position:absolute; top:88px; right:24px; z-index:20;
  width:330px; max-height:calc(100vh - 120px);
  display:flex; flex-direction:column;
  border-radius:20px; overflow:hidden;
  background:var(--glass); backdrop-filter:blur(18px);
  border:1px solid var(--line-strong);
  box-shadow:0 18px 60px rgba(0,0,0,.5), 0 0 40px rgba(34,211,238,.12);
  opacity:0; transform:translateX(40px); pointer-events:none;
  transition:opacity .45s ease, transform .45s ease;
}
#panel.show{opacity:1; transform:translateX(0); pointer-events:auto}
#panel .p-head{
  padding:20px 22px 16px;
  background:linear-gradient(135deg, rgba(34,211,238,.14), rgba(139,92,246,.12));
  border-bottom:1px solid var(--line);
}
#panel .p-head .tag{font-size:11px; letter-spacing:2px; color:var(--cyan-soft); text-transform:uppercase}
#panel .p-head h2{font-size:24px; margin:6px 0 4px; font-weight:700}
#panel .p-head .sub{font-size:12px; color:var(--muted)}
#panel .p-list{overflow-y:auto; padding:12px 14px 16px; flex:1}
#panel .p-list::-webkit-scrollbar{width:6px}
#panel .p-list::-webkit-scrollbar-thumb{background:rgba(34,211,238,.3); border-radius:3px}
.stu{
  width:100%; text-align:left; cursor:pointer;
  display:flex; align-items:center; gap:12px;
  padding:11px 12px; margin-bottom:8px;
  border-radius:14px; border:1px solid rgba(34,211,238,.14);
  background:rgba(255,255,255,.03);
  transition:.22s;
}
.stu:hover{transform:translateX(4px); border-color:var(--cyan); background:rgba(34,211,238,.08); box-shadow:0 0 18px rgba(34,211,238,.22)}
.stu .av{
  flex:0 0 auto; width:38px; height:38px; border-radius:11px;
  display:grid; place-items:center; font-weight:700; font-size:15px;
  background:linear-gradient(135deg, rgba(34,211,238,.35), rgba(139,92,246,.35));
  color:#dff6ff; border:1px solid var(--line-strong);
}
.stu .nm{font-size:14.5px; font-weight:600}
.stu .uni{font-size:12px; color:var(--muted); margin-top:2px}
.stu .go{margin-left:auto; color:var(--cyan-soft); font-size:16px}
#panel .p-foot{padding:12px 18px; border-top:1px solid var(--line)}
.backbtn{
  cursor:pointer; width:100%; text-align:center;
  padding:10px; border-radius:12px; font-size:13px; letter-spacing:1px;
  color:var(--ink); background:rgba(255,255,255,.05); border:1px solid var(--line);
  transition:.22s;
}
.backbtn:hover{border-color:var(--cyan); color:var(--cyan-soft); box-shadow:0 0 16px rgba(34,211,238,.3)}

/* ---------- tooltip ---------- */
#tooltip{
  position:fixed; z-index:40; pointer-events:none; display:none;
  padding:8px 13px; border-radius:10px; font-size:12.5px; letter-spacing:.5px;
  color:var(--ink); background:rgba(8,15,30,.92); border:1px solid var(--line-strong);
  box-shadow:0 8px 26px rgba(0,0,0,.5), 0 0 16px rgba(34,211,238,.25);
}
#tooltip b{color:var(--cyan-soft)}

/* ---------- toast ---------- */
#toast{
  position:fixed; left:50%; top:78px; transform:translate(-50%,-16px); z-index:50;
  padding:10px 20px; border-radius:12px; font-size:13px;
  color:#ffe9c7; background:rgba(40,30,10,.9); border:1px solid rgba(255,190,90,.4);
  opacity:0; pointer-events:none; transition:.3s;
}
#toast.show{opacity:1; transform:translate(-50%,0)}

/* ---------- markers ---------- */
.marker-outer{position:absolute; left:0; top:0; width:0; height:0; overflow:visible; pointer-events:none; z-index:3}
.marker-label{
  position:absolute; left:0; top:0;
  pointer-events:auto; cursor:pointer; white-space:nowrap;
  transform:translate(-50%,-50%);
  padding:7px 12px; border-radius:12px;
  border:1px solid rgba(34,211,238,.35);
  background:linear-gradient(135deg, rgba(9,18,36,.94), rgba(14,28,52,.94));
  box-shadow:0 6px 22px rgba(0,0,0,.5), 0 0 16px rgba(34,211,238,.22);
  transition:border-color .2s, box-shadow .2s, background .2s;
}
.marker-label .nm{font-size:13px; font-weight:700; color:#eaf6ff; letter-spacing:.5px}
.marker-label .uni{font-size:10.5px; color:var(--muted); margin-top:1px; letter-spacing:.5px}
.marker-label:hover{border-color:var(--cyan); background:linear-gradient(135deg, rgba(14,40,56,.96), rgba(24,38,72,.96)); box-shadow:0 0 26px rgba(34,211,238,.6)}
.marker-dot{pointer-events:none}

/* ---------- messages section ---------- */
#messages{
  position:relative; z-index:60;
  margin-top:100vh;
  min-height:100vh;
  padding:110px 6vw 80px;
  background:linear-gradient(180deg, rgba(4,7,15,.2) 0%, rgba(4,7,15,.92) 18%, #04070f 100%);
  backdrop-filter:blur(0px);
}
#messages::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(60% 40% at 50% 0%, rgba(34,211,238,.1), transparent 65%);
}
.sec-head{text-align:center; margin-bottom:38px; position:relative}
.sec-head .en{font-family:"Orbitron",sans-serif; letter-spacing:4px; font-size:12px; color:var(--cyan-soft); margin-bottom:8px}
.sec-head h2{font-size:clamp(26px,4vw,40px); font-weight:700;
  background:linear-gradient(90deg,#eaf6ff,#7be8ff,#c4b5fd); -webkit-background-clip:text; background-clip:text; color:transparent}
.sec-head p{color:var(--muted); margin-top:10px; font-size:14px; letter-spacing:1px}

.msg-wrap{display:grid; grid-template-columns:360px 1fr; gap:26px; max-width:1180px; margin:0 auto; position:relative}
.msg-form{
  padding:24px; border-radius:20px; height:fit-content; position:sticky; top:100px;
  background:var(--glass); border:1px solid var(--line-strong); backdrop-filter:blur(16px);
  box-shadow:0 16px 50px rgba(0,0,0,.45);
}
.msg-form h3{font-size:17px; margin-bottom:16px; display:flex; align-items:center; gap:8px}
.msg-form label{display:block; font-size:12.5px; color:var(--muted); margin:14px 0 7px; letter-spacing:1px}
.msg-form input,.msg-form textarea{
  width:100%; padding:12px 14px; border-radius:12px;
  color:var(--ink); background:rgba(3,8,18,.6); border:1px solid var(--line);
  font-family:inherit; font-size:14px; outline:none; transition:.2s; resize:none;
}
.msg-form input:focus,.msg-form textarea:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(34,211,238,.14)}
.msg-form textarea{height:120px; line-height:1.7}
.submit{
  cursor:pointer; width:100%; margin-top:18px; padding:13px; border:none; border-radius:12px;
  font-size:15px; font-weight:600; letter-spacing:2px; color:#03121a;
  background:linear-gradient(90deg, var(--cyan), var(--teal));
  box-shadow:0 8px 26px rgba(34,211,238,.35);
  transition:.22s;
}
.submit:hover{transform:translateY(-2px); box-shadow:0 12px 34px rgba(34,211,238,.5)}
.submit:active{transform:translateY(0)}

.msg-wall{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; align-content:start}
.msg-empty{grid-column:1/-1; text-align:center; padding:56px 20px; border:1px dashed var(--line); border-radius:18px; color:var(--muted); font-size:14px; letter-spacing:1px}
.msg-card{
  position:relative; padding:18px 18px 16px; border-radius:18px;
  background:rgba(13,22,42,.55); border:1px solid var(--line); backdrop-filter:blur(10px);
  animation:pop .4s ease both;
}
@keyframes pop{from{opacity:0; transform:translateY(12px) scale(.97)} to{opacity:1; transform:none}}
.msg-card .head{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.msg-card .av{
  width:34px;height:34px;border-radius:10px; display:grid; place-items:center; font-weight:700;
  background:linear-gradient(135deg, rgba(34,211,238,.4), rgba(139,92,246,.4)); border:1px solid var(--line-strong); color:#e6f7ff;
}
.msg-card .who{font-weight:600; font-size:14px}
.msg-card .when{font-size:11px; color:var(--muted)}
.msg-card .txt{font-size:14px; line-height:1.8; color:#d6e6f8; white-space:pre-wrap}
.msg-card .del{
  position:absolute; top:12px; right:12px; cursor:pointer; color:var(--muted);
  border:none; background:none; font-size:14px; opacity:0; transition:.2s;
}
.msg-card:hover .del{opacity:1}
.msg-card .del:hover{color:#ff7b8a}

/* ---------- modal ---------- */
#modal{
  position:fixed; inset:0; z-index:80; display:none; place-items:center; padding:24px;
  background:rgba(3,6,14,.6); backdrop-filter:blur(10px);
}
#modal.show{display:grid}
.modal-box{
  width:min(520px,94vw); max-height:88vh; overflow-y:auto;
  border-radius:22px; padding:30px 30px 26px;
  background:linear-gradient(160deg, rgba(14,26,50,.96), rgba(8,14,28,.96));
  border:1px solid var(--line-strong);
  box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 50px rgba(34,211,238,.16);
  animation:pop .35s ease both;
}
.modal-box::-webkit-scrollbar{width:6px}
.modal-box::-webkit-scrollbar-thumb{background:rgba(34,211,238,.3); border-radius:3px}
.modal-top{display:flex; align-items:center; gap:14px}
.modal-av{
  width:52px;height:52px;border-radius:14px; display:grid; place-items:center;
  font-size:22px; font-weight:700; color:#eaf6ff;
  background:linear-gradient(135deg, rgba(34,211,238,.45), rgba(139,92,246,.45));
  border:1px solid var(--line-strong); box-shadow:0 0 22px rgba(34,211,238,.3);
}
.modal-top .nm{font-size:20px; font-weight:700}
.modal-top .uni{font-size:14px; color:var(--cyan-soft); margin-top:3px}
.modal-top .city{font-size:12px; color:var(--muted); margin-top:4px}
.modal-close{margin-left:auto; cursor:pointer; width:34px;height:34px;border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); font-size:16px; transition:.2s}
.modal-close:hover{color:#fff; border-color:var(--cyan); box-shadow:0 0 14px rgba(34,211,238,.4)}
.rate{margin:16px 0 4px; font-size:12px; color:var(--muted); letter-spacing:1px}
.rate .stars{color:#ffd76a; font-size:14px; letter-spacing:2px; margin-left:6px}
.ill-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px}
.ill{position:relative; border-radius:16px; overflow:hidden; border:1px solid var(--line); height:132px; background:#0a1428}
.ill .ill-bg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:0}
.ill .ill-emoji{font-size:48px; line-height:1; filter:drop-shadow(0 6px 14px rgba(0,0,0,.55)); animation:floaty 3.2s ease-in-out infinite}
.ill .skyline{position:absolute; left:0; right:0; bottom:0; width:100%; height:60px; opacity:.55; z-index:1}
.ill .ill-photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:2}
.ill .ill-cap{position:absolute; left:0; right:0; bottom:0; padding:28px 12px 10px; background:linear-gradient(transparent, rgba(0,0,0,.82)); font-size:12px; color:#eaf6ff; z-index:3}
.ill .ill-cap .tag{display:block; font-size:10px; color:#9fd4e8; letter-spacing:1.5px; margin-bottom:2px}
.ill .ill-cap b{font-size:15px}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media (max-width:520px){ .ill-row{grid-template-columns:1fr} }
.modal-sec{margin-top:20px}
.modal-sec h4{display:flex; align-items:center; gap:8px; font-size:13px; letter-spacing:2px; color:var(--cyan-soft); margin-bottom:10px}
.modal-sec h4::before{content:""; width:16px; height:2px; background:linear-gradient(90deg,var(--cyan),transparent)}
.modal-sec p{font-size:14px; line-height:1.9; color:#cfe2f6}
.food-card{
  margin-top:14px; padding:16px; border-radius:16px;
  background:linear-gradient(135deg, rgba(34,211,238,.1), rgba(139,92,246,.1));
  border:1px solid var(--line);
}
.food-card .fname{font-size:15px; font-weight:700; color:#ffe9c7}
.food-card .fname span{font-size:18px; margin-right:6px}
.food-card p{font-size:13.5px; line-height:1.8; color:#e4d9c2; margin-top:6px}

/* ---------- loading ---------- */
#loading{
  position:fixed; inset:0; z-index:100; display:grid; place-items:center;
  background:radial-gradient(100% 100% at 50% 40%, #0a1428, #04070f);
  transition:opacity .6s;
}
#loading.hide{opacity:0; pointer-events:none}
.load-box{text-align:center}
.spinner{
  width:60px;height:60px;margin:0 auto 20px;border-radius:50%;
  border:3px solid rgba(34,211,238,.15); border-top-color:var(--cyan);
  animation:spin 1s linear infinite; box-shadow:0 0 30px rgba(34,211,238,.25);
}
@keyframes spin{to{transform:rotate(360deg)}}
.load-box .t{font-family:"Orbitron",sans-serif; letter-spacing:3px; color:var(--cyan-soft); font-size:14px}
.load-box .s{font-size:12px; color:var(--muted); margin-top:8px; letter-spacing:2px}

@media (max-width:820px){
  header{padding:12px 14px}
  .logo{width:34px; height:34px; font-size:16px; border-radius:10px}
  .title h1{font-size:15px; letter-spacing:1px}
  .title p{font-size:10px; letter-spacing:1px}
  .topnav{gap:8px}
  .navbtn{padding:8px 12px; font-size:12px}
  .topnav .navbtn span{display:none}
  #hint{bottom:14px; font-size:11px; padding:8px 14px; letter-spacing:.5px}
  #panel{right:10px; left:10px; width:auto; top:auto; bottom:calc(12px + env(safe-area-inset-bottom)); max-height:46vh; border-radius:20px 20px 12px 12px}
  #panel .p-head{padding:16px 18px 12px}
  #panel .p-head h2{font-size:20px}
  .stu{padding:12px; margin-bottom:6px}
  .stu .av{width:40px; height:40px; font-size:16px}
  .msg-wrap{grid-template-columns:1fr}
  .msg-form{position:static}
  #messages{padding:90px 16px 60px}
  .modal-box{padding:22px 18px 20px}
  .ill{height:112px}
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="aurora"></div>
<div id="gridline"></div>

<header>
  <div class="brand">
    <div class="logo">🎓</div>
    <div class="title">
      <h1>CLASS A10 · 2026</h1>
      <p>石家庄二中实验学校 · 毕业蹭饭地图</p>
    </div>
  </div>
  <div class="topnav">
    <button class="navbtn" id="homeBtn">🗺️ <span>全国地图</span></button>
    <button class="navbtn primary" id="msgNavBtn">💬 <span>同学寄语</span></button>
  </div>
</header>

<div id="stage">
  <div id="glwrap">
    <canvas id="scene"></canvas>
    <div id="css2d"></div>
  </div>

  <div id="panel">
    <div class="p-head">
      <div class="tag">▍CLASSMATES IN THIS PROVINCE</div>
      <h2 id="pName">河北省</h2>
      <div class="sub" id="pSub">7 位同学 · 点击名字查看学校与美食</div>
    </div>
    <div class="p-list" id="pList"></div>
    <div class="p-foot"><button class="backbtn" id="backBtn">↺ 返回全国地图</button></div>
  </div>

  <div id="hint"><kbd>拖拽</kbd> 移动 · <kbd>滚轮</kbd> 缩放 · <kbd>右键</kbd> 旋转 · <kbd>点击</kbd> 省份查看同学</div>
</div>

<div id="messages">
  <div class="sec-head">
    <div class="en">— MESSAGE WALL —</div>
    <h2>同学寄语墙</h2>
    <p>把想对大家说的话留在这里，愿我们各自奔赴山海，顶峰相见</p>
  </div>
  <div class="msg-wrap">
    <div class="msg-form">
      <h3>✍️ 写下你的寄语</h3>
      <label>你的名字</label>
      <input id="mName" list="nameList" placeholder="例如：范漪曼" maxlength="20" />
      <datalist id="nameList"></datalist>
      <label>寄语内容</label>

<script>
/* ===== 星空背景 ===== */
(function(){
  var cv = document.getElementById('bg');
  var ctx = cv.getContext('2d');
  var stars = [], meteors = [];
  function resize(){
    cv.width = innerWidth; cv.height = innerHeight;
    stars = [];
    var n = Math.floor(innerWidth*innerHeight/5500);
    for(var i=0;i<n;i++){
      stars.push({x:Math.random()*cv.width, y:Math.random()*cv.height,
        r:Math.random()*1.4+0.3, a:Math.random()*Math.PI*2, s:0.3+Math.random()*1.4});
    }
  }
  resize(); addEventListener('resize', resize);
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<stars.length;i++){
      var st = stars[i];
      st.a += 0.01*st.s;
      var al = 0.35 + 0.65*Math.abs(Math.sin(st.a));
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + (Math.random()<0.15?'190,220,255':'210,235,255') + ',' + al + ')';
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fill();
    }
    if(Math.random()<0.006 && meteors.length<2){
      meteors.push({x:Math.random()*cv.width*0.7+cv.width*0.2, y:Math.random()*cv.height*0.3,
        vx:-(5+Math.random()*4), vy:2+Math.random()*2, life:1});
    }
    for(var j=meteors.length-1;j>=0;j--){
      var m = meteors[j];
      m.x += m.vx; m.y += m.vy; m.life -= 0.014;
      ctx.beginPath();
      var g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx*9, m.y - m.vy*9);
      g.addColorStop(0,'rgba(160,240,255,'+Math.max(0,m.life)+')');
      g.addColorStop(1,'rgba(160,240,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6;
      ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx*9, m.y - m.vy*9); ctx.stroke();
      if(m.life<=0) meteors.splice(j,1);
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>

function makeGlowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.22,'rgba(150,240,255,.85)');
  g.addColorStop(0.55,'rgba(34,211,238,.28)');
  g.addColorStop(1,'rgba(34,211,238,0)');
  x.fillStyle = g; x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}

function proj(lng, lat){
  return new THREE.Vector3((lng - CENTER.lng) * S, 0, -(lat - CENTER.lat) * S * LATK);
}

async function loadGeoJSON(){
  const urls = [
    './china.json',
    'https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json',
    'https://registry.npmmirror.com/echarts@4.9.0/files/map/json/china.json',
    'https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/json/china.json'
  ];
  let lastErr = null;
  for (const u of urls){
    try {
      const r = await fetch(u);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('geo load failed');
}

function walkCoords(coords, cb){
  if (!coords) return;
  if (typeof coords[0] === 'number'){
    cb(coords[0], coords[1]);
  } else {
    for (let i=0;i<coords.length;i++) walkCoords(coords[i], cb);
  }
}

function featureCenter(feature){
  const p = feature.properties || {};
  const c = p.center || p.centroid || p.cp;
  if (Array.isArray(c) && c.length >= 2) return { lng:c[0], lat:c[1] };
  let minLng=180,maxLng=-180,minLat=90,maxLat=-90, any=false;
  walkCoords(feature.geometry.coordinates, function(lng,lat){
    any = true;
    if(lng<minLng)minLng=lng; if(lng>maxLng)maxLng=lng;
    if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat;
  });
  if(!any) return { lng:CENTER.lng, lat:CENTER.lat };
  return { lng:(minLng+maxLng)/2, lat:(minLat+maxLat)/2 };
}

function buildMap(fc){
  // 计算包围盒
  let minLng=180,maxLng=-180,minLat=90,maxLat=-90;
  fc.features.forEach(function(f){
    walkCoords(f.geometry.coordinates, function(lng,lat){
      if(lng<minLng)minLng=lng; if(lng>maxLng)maxLng=lng;
      if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat;
    });
  });
  CENTER = { lng:(minLng+maxLng)/2, lat:(minLat+maxLat)/2 };
  const TARGET_W = 100, TARGET_H = 74;
  S = Math.min(TARGET_W/(maxLng-minLng), TARGET_H/((maxLat-minLat)*LATK));
  HOME.target.set(0,0,0);
  HOME.pos.set(0, 130, 15);

  mapRoot = new THREE.Group();

  fc.features.forEach(function(feature){
    const key = norm(feature.properties.name);
    const full = provinceShort[key];
    const students = full ? byProvince[full] : [];
    const has = students.length > 0;

    const group = new THREE.Group();
    group.userData = {
      key: key, fullName: feature.properties.name,
      students: students, hasStudents: has,
      center: featureCenter(feature),
      lift: 0, targetLift: 0,
      materials: [], edges: [],
      baseEmissive: has ? 0x0ea8b8 : 0x02040a,
      baseEmissiveIntensity: has ? 0.55 : 1.0,
      baseEdgeColor: has ? 0x1fd8e8 : 0x35517a,
      baseEdgeOpacity: has ? 0.55 : 0.28
    };

    const mat = new THREE.MeshStandardMaterial(has ?
      { color:0x123848, metalness:0.4, roughness:0.45, emissive:0x0ea8b8, emissiveIntensity:0.55 } :
      { color:0x16233f, metalness:0.3, roughness:0.55, emissive:0x02040a, emissiveIntensity:1 });
    const emat = new THREE.LineBasicMaterial(has ?
      { color:0x1fd8e8, transparent:true, opacity:0.55 } :
      { color:0x35517a, transparent:true, opacity:0.28 });
    const polys = feature.geometry.type === 'MultiPolygon' ? feature.geometry.coordinates : [feature.geometry.coordinates];

    polys.forEach(function(poly){
      const shape = new THREE.Shape();
      const outer = poly[0];
      shape.moveTo((outer[0][0]-CENTER.lng)*S, (outer[0][1]-CENTER.lat)*S*LATK);
      for (let i=1;i<outer.length;i++){
        shape.lineTo((outer[i][0]-CENTER.lng)*S, (outer[i][1]-CENTER.lat)*S*LATK);
      }
      for (let h=1;h<poly.length;h++){
        const hole = poly[h];
        const path = new THREE.Path();
        path.moveTo((hole[0][0]-CENTER.lng)*S, (hole[0][1]-CENTER.lat)*S*LATK);
        for (let i=1;i<hole.length;i++){
          path.lineTo((hole[i][0]-CENTER.lng)*S, (hole[i][1]-CENTER.lat)*S*LATK);
        }
        shape.holes.push(path);
      }
      const geo = new THREE.ExtrudeGeometry(shape, { depth:H, bevelEnabled:false });
      geo.rotateX(-Math.PI/2);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData.province = key;
      group.add(mesh);
      group.userData.materials.push(mat);

      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 12), emat);
      edges.userData.province = key;
      group.add(edges);
      group.userData.edges.push(edges);
    });

    mapRoot.add(group);
    provinceGroups[key] = group;
  });

  scene.add(mapRoot);
  buildProvinceLabels();
}

const LABEL_OFFSET = {
  '北京':[-1,-2.5], '天津':[3,2.5], '江苏':[2.5,0], '安徽':[-2.5,0],
  '浙江':[2,1], '重庆':[-3,1.5], '上海':[3.5,0], '宁夏':[2.5,1],
  '香港':[2.5,1.5], '澳门':[1.5,0], '海南':[2.5,1]
};
function roundRectPath(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function makeLabel(name, count){
  const has = count > 0;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const nameFont = '700 ' + (has ? 20 : 16) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.font = nameFont;
  const nameW = Math.ceil(ctx.measureText(name).width);
  let W, H;
  if (has){
    ctx.font = '700 12px "PingFang SC","Microsoft YaHei",sans-serif';
    const cntW = Math.ceil(ctx.measureText(count + '人').width);
    W = Math.max(nameW, cntW) + 16;
    H = 48;
  } else {
    W = nameW + 14;
    H = 26;
  }
  canvas.width = W; canvas.height = H;
  const c = canvas.getContext('2d');
  // 平贴在地图表面：极淡底衬，无浮块
  roundRectPath(c, 1, 1, W-2, H-2, 7);
  c.fillStyle = has ? 'rgba(6,12,24,0.5)' : 'rgba(6,12,24,0.38)';
  c.fill();
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  if (has){
    c.font = nameFont;
    c.fillStyle = '#f4fbff';
    c.fillText(name, W/2, 16);
    c.font = '700 12px "PingFang SC","Microsoft YaHei",sans-serif';
    c.fillStyle = '#22d3ee';
    c.fillText(count + '人', W/2, 36);
  } else {
    c.font = nameFont;
    c.fillStyle = '#a9c0dc';
    c.fillText(name, W/2, H/2 + 1);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  const hWorld = has ? 2.1 : 1.3;
  const wWorld = hWorld * (W/H);
  const geo = new THREE.PlaneGeometry(wWorld, hWorld);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.renderOrder = 60;
  mesh.userData.w = wWorld;
  mesh.userData.h = hWorld;
  return mesh;
}
function buildProvinceLabels(){
  const items = [];
  Object.keys(provinceGroups).forEach(function(key){
    const g = provinceGroups[key];
    const n = g.userData.students.length;
    const lb = makeLabel(key, n);
    const c = proj(g.userData.center.lng, g.userData.center.lat);
    const off = LABEL_OFFSET[key] || [0,0];
    lb.position.set(c.x + off[0], H + 0.05, c.z + off[1]);
    lb.userData.province = key;
    lb.userData.center = new THREE.Vector3(c.x, H + 0.05, c.z);
    g.add(lb);
    provinceLabels.push(lb);
    items.push(lb);
  });
  spreadLabels(items);
  addLeaderLines(items);
}

/* 防止标签堆叠：世界坐标下做简单的 2D 碰撞分离 */
function spreadLabels(items){
  const MARGIN = 1.7;
  for (let iter = 0; iter < 50; iter++){
    let moved = false;
    for (let i = 0; i < items.length; i++){
      for (let j = i + 1; j < items.length; j++){
        const a = items[i], b = items[j];
        const dx = b.position.x - a.position.x;
        const dz = b.position.z - a.position.z;
        const minDx = (a.userData.w + b.userData.w) / 2 + MARGIN;
        const minDz = (a.userData.h + b.userData.h) / 2 + 1.1;
        if (Math.abs(dx) < minDx && Math.abs(dz) < minDz){
          const ox = minDx - Math.abs(dx);
          const oz = minDz - Math.abs(dz);
          if (ox < oz){
            const sx = dx >= 0 ? 1 : -1;
            a.position.x -= sx * ox / 2;
            b.position.x += sx * ox / 2;
          } else {
            const sz = dz >= 0 ? 1 : -1;
            a.position.z -= sz * oz / 2;
            b.position.z += sz * oz / 2;
          }
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
}

function makeLeader(a, b){
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const mat = new THREE.LineBasicMaterial({ color:0x2fd3e6, transparent:true, opacity:0.6, depthWrite:false, depthTest:false });
  const line = new THREE.Line(geo, mat);
  line.renderOrder = 55;
  return line;
}
function addLeaderLines(items){
  if (leaderGroup) scene.remove(leaderGroup);
  leaderGroup = new THREE.Group();
  items.forEach(function(lb){
    const c = lb.userData.center;
    if (!c) return;
    const dx = lb.position.x - c.x;
    const dz = lb.position.z - c.z;
    if (Math.hypot(dx, dz) < 2.2) return;
    const a = new THREE.Vector3(c.x, H + 0.02, c.z);
    const b = new THREE.Vector3(lb.position.x, H + 0.02, lb.position.z);
    leaderGroup.add(makeLeader(a, b));
  });
  scene.add(leaderGroup);
}

/* ================= 交互 ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downX=0, downY=0;

function pickProvince(clientX, clientY){
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX-rect.left)/rect.width)*2 - 1;
  pointer.y = -((clientY-rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const meshes = [];
  Object.keys(provinceGroups).forEach(function(k){ meshes.push.apply(meshes, provinceGroups[k].children); });
  const hits = raycaster.intersectObjects(meshes, false);
  for (const h of hits){
    const key = h.object.userData.province;
    if (key && provinceGroups[key]) return key;
  }
  return null;
}

function showTooltip(e, key){
  const g = provinceGroups[key];
  const t = document.getElementById('tooltip');
  const cnt = g.userData.students.length;
  t.innerHTML = '<b>' + g.userData.fullName + '</b> · ' + (cnt ? (cnt + ' 位同学') : '暂无同学');
  t.style.display = 'block';
  const w = t.offsetWidth, h = t.offsetHeight;
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 16;
  if (y + h > innerHeight - 8) y = e.clientY - h - 16;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTooltip(){ document.getElementById('tooltip').style.display = 'none'; }

function bindEvents(){
  renderer.domElement.addEventListener('pointermove', function(e){
    const key = pickProvince(e.clientX, e.clientY);
    if (key){
      renderer.domElement.style.cursor = 'pointer';
      showTooltip(e, key);
    } else {
      renderer.domElement.style.cursor = 'grab';
      hideTooltip();
    }
    setHover(key);
  });

  renderer.domElement.addEventListener('pointerdown', function(e){ downX=e.clientX; downY=e.clientY; });
  renderer.domElement.addEventListener('pointerup', function(e){
    if (Math.hypot(e.clientX-downX, e.clientY-downY) > 6) return;
    const key = pickProvince(e.clientX, e.clientY);
    if (key) selectProvince(key);
  });

  renderer.domElement.addEventListener('pointerleave', function(){ setHover(null); hideTooltip(); });

  addEventListener('resize', function(){
    camera.aspect = wrap.clientWidth/wrap.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    cssRenderer.setSize(wrap.clientWidth, wrap.clientHeight);
  });
}

function setHover(key){
  if (key === (hoverProv && hoverProv.userData.key)) return;
  if (hoverProv) lastHoverProv = hoverProv;
  hoverProv = key ? provinceGroups[key] : null;

  if (hoverProv){
    const u = hoverProv.userData;
    u.targetLift = 0.85;
    u.materials.forEach(function(m){ m.emissive.set(0x9ff3ff); });
    u.edges.forEach(function(e){ e.material.color.set(0x9ff3ff); e.material.opacity = 0.95; });
  }
  if (lastHoverProv && lastHoverProv !== hoverProv){
    const u = lastHoverProv.userData;
    u.targetLift = 0;
    u.materials.forEach(function(m){ m.emissive.set(u.baseEmissive); });
    u.edges.forEach(function(e){ e.material.color.set(u.baseEdgeColor); e.material.opacity = u.baseEdgeOpacity; });
  }
}

function selectProvince(key){
  const g = provinceGroups[key];
  if (!g) return;
  if (!g.userData.hasStudents){
    toast(g.userData.fullName + ' 暂无同学在这里，换个发光的地方试试～');
    pulse(key);
    return;
  }
  focusProvince(key);
}

function pulse(key){
  const g = provinceGroups[key];
  g.userData.targetLift = 1.1;
  setTimeout(function(){ if (!hoverProv || hoverProv !== g) g.userData.targetLift = 0; }, 350);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function focusProvince(key){
  const g = provinceGroups[key];
  focusedKey = key;
  controls.autoRotate = false;

  const c = proj(g.userData.center.lng, g.userData.center.lat);
  const dir = new THREE.Vector3(0, 0.7071, 0.7071);
  const dist = 38;
  camAnim = {
    fromTarget: controls.target.clone(), toTarget: c.clone(),
    fromCam: camera.position.clone(), toCam: c.clone().add(dir.multiplyScalar(dist)),
    t: 0, dur: 1300
  };
  controls.enabled = false;

  document.body.classList.add('focused');
  provinceLabels.forEach(function(l){ l.visible = false; });
  if (leaderGroup) leaderGroup.visible = false;
  openPanel(g);
  buildMarkers(g);
}

function resetView(){
  focusedKey = null;
  document.body.classList.remove('focused');
  provinceLabels.forEach(function(l){ l.visible = true; });
  if (leaderGroup) leaderGroup.visible = true;
  closePanel();
  clearMarkers();
  camAnim = {
    fromTarget: controls.target.clone(), toTarget: HOME.target.clone(),
    fromCam: camera.position.clone(), toCam: HOME.pos.clone(),
    t: 0, dur: 1300
  };
  controls.enabled = false;
}

/* ================= 标记 ================= */
function clearMarkers(){
  while (markerGroup.children.length) markerGroup.remove(markerGroup.children[0]);
}

function buildMarkers(g){
  clearMarkers();
  const s = g.userData.students;
  const byCity = {};
  s.forEach(function(st){ (byCity[st.city] = byCity[st.city] || []).push(st); });

  Object.keys(byCity).forEach(function(city){
    const arr = byCity[city];
    const p = proj(arr[0].pos[0], arr[0].pos[1]);
    p.y = H + 0.6;

    const dot = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:0x9ff4ff, transparent:true, depthWrite:false, depthTest:false, blending:THREE.AdditiveBlending }));
    dot.scale.set(1.5, 1.5, 1);
    dot.position.copy(p);
    dot.renderOrder = 70;
    dot.userData.pulse = Math.random()*Math.PI*2;
    markerGroup.add(dot);
  });
}

function updateMarkers(dt){
  const t = performance.now()/1000;
  markerGroup.children.forEach(function(o){
    if (o.userData && o.userData.pulse !== undefined){
      const sc = 1.5 + Math.sin(t*4 + o.userData.pulse)*0.5;
      o.scale.set(sc, sc, 1);
    }
  });
}

/* ================= 动画 ================= */
function easeInOutCubic(k){ return k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k+2,3)/2; }

function updateCamAnim(){
  if (!camAnim) return;
  camAnim.t += 16;
  const k = Math.min(1, camAnim.t/camAnim.dur);
  const e = easeInOutCubic(k);
  controls.target.lerpVectors(camAnim.fromTarget, camAnim.toTarget, e);
  camera.position.lerpVectors(camAnim.fromCam, camAnim.toCam, e);
  if (k >= 1){ camAnim = null; controls.enabled = true; }
}

function updateLift(dt){
  const k = Math.min(1, dt*8);
  [hoverProv, lastHoverProv].forEach(function(g){
    if (!g) return;
    g.userData.lift += (g.userData.targetLift - g.userData.lift) * k;
    g.position.y = g.userData.lift;
    const cur = g.userData.materials[0];
    if (cur){
      const targetI = g.userData.targetLift > 0 ? 1.2 : g.userData.baseEmissiveIntensity;
      g.userData.materials.forEach(function(m){ m.emissiveIntensity += (targetI - m.emissiveIntensity) * k; });
    }
  });
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateCamAnim();
  updateLift(dt);
  controls.update();
  updateMarkers(dt);
  renderer.render(scene, camera);
  cssRenderer.render(scene, camera);
}

/* ================= 寄语墙 ================= */
const MSG_KEY = 'a10_cengfan_messages_v1';
const SEED = [];

function saveMsgs(){
  try { localStorage.setItem(MSG_KEY, JSON.stringify(msgs)); } catch(e){}
}
function loadMsgs(){
  try {
    const raw = localStorage.getItem(MSG_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return SEED.slice();
}
let msgs = loadMsgs();

function renderWall(){
  const wall = document.getElementById('msgWall');
  wall.innerHTML = '';
  if (!msgs.length){
    const empty = document.createElement('div');
    empty.className = 'msg-empty';
    empty.textContent = '还没有寄语，快来写下第一条吧 ✍️';
    wall.appendChild(empty);
    return;
  }
  msgs.forEach(function(m, idx){
    const c = document.createElement('div');
    c.className = 'msg-card';
    const when = new Date(m.t);
    const ds = when.getMonth()+1 + '月' + when.getDate() + '日 ' + String(when.getHours()).padStart(2,'0') + ':' + String(when.getMinutes()).padStart(2,'0');
    c.innerHTML =
      '<button class="del" title="删除">✕</button>' +
      '<div class="head"><div class="av">' + (m.name||'匿')[0] + '</div>' +
      '<div><div class="who">' + (m.name||'匿名同学') + '</div><div class="when">' + ds + '</div></div></div>' +
      '<div class="txt">' + escapeHtml(m.text) + '</div>';
    c.querySelector('.del').onclick = function(){
      msgs.splice(idx,1);
      saveMsgs();
      renderWall();
    };
    wall.appendChild(c);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(ch){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch];
  });
}

document.getElementById('mSubmit').onclick = function(){
  const name = document.getElementById('mName').value.trim();
  const text = document.getElementById('mText').value.trim();
  if (!text){ toast('写点内容再发布吧～'); return; }
  msgs.unshift({ name: name || '匿名同学', text: text, t: Date.now() });
  if (msgs.length > 200) msgs.length = 200;
  saveMsgs();
  document.getElementById('mName').value = '';
  document.getElementById('mText').value = '';
  renderWall();
  toast('寄语已发布，墙上有你啦 ✨');
};
